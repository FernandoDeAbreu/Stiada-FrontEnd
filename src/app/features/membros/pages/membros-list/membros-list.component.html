<div class="loading" *ngIf="loading" aria-live="polite">Carregando...</div>

<section class="membros-container">
  <div
    class="membro-card"
    *ngFor="let membro of membros"
    (click)="editMembro(membro)"
    tabindex="0"
    [attr.aria-label]="'Editar ' + membro.nome"
  >
    <div class="avatar">
      <span class="avatar-text">{{ membro.nome.charAt(0).toUpperCase() }}</span>
    </div>
    <div class="info">
      <strong>{{ membro.nome }}</strong>
    </div>
  </div>

  <a routerLink="/membros/novo" class="btn-add" aria-label="Adicionar novo membro">+</a>
</section>
