<h1 mat-dialog-title>{{tipoContribuicao}}</h1>
<form class="example-form" [formGroup]="createForm">
  <mat-form-field class="example-full-width">
    <mat-label>Data</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="data" required>
    <mat-datepicker-toggle matIconSuffix [for]="picker">
      <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>
    </mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <mat-form-field class="example-full-width">
    <mat-label>Valor</mat-label>
    <input matInput type="number" placeholder="R$ 100,00" formControlName="valor" required>
  </mat-form-field>

  <mat-form-field class="example-full-width">
    <mat-label>Breve comentário</mat-label>
    <textarea matInput formControlName="observacao"  placeholder="Ex. escreva algo..."></textarea>
  </mat-form-field>

  <div class="form-buttons">
    <button class="btn-warn" mat-raised-button color="warn" type="button" (click)="closeDialog()">Cancelar</button>
    <button class="btn-primary" mat-raised-button type="button" (click)="salvar()">Salvar</button>
  </div>
</form>
